# lana demo/production stack: Postgres with PostGIS + the lana server.
# Runs unchanged on a demo laptop and on the team's Proxmox host (behind a
# Cloudflare tunnel) - see README.md, "Deployment".
#
# The server container applies the SQL migrations on startup (its `serve`
# mode always does), serves the API + SSE on 8080 and runs the background
# measurement poller. All data lives in the named `pgdata` volume and
# survives container restarts and rebuilds.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: lana
      POSTGRES_PASSWORD: lana
      POSTGRES_DB: lana
    volumes:
      # Named volume: data survives `docker compose restart` / `down` (and
      # re-up) - only `docker compose down -v` deletes it.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lana -d lana"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  server:
    build: .
    environment:
      DATABASE_URL: postgres://lana:lana@db:5432/lana
      # Optional overrides (uncomment to set):
      # LANA_BIND_ADDR: 0.0.0.0:8080
      # LANA_POLL_INTERVAL_SECS: 600
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
