services:

  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    container_name: valhalla
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./:/data
    working_dir: /data
    command:
      - valhalla_service
      - /data/valhalla.json
      - "4"

  web:
    image: nginx:alpine
    container_name: valhalla-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - valhalla
